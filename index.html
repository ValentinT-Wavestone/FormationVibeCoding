<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Jump — Cyber Academy</title>
  <style>
    :root{--ink:#effaff;--muted:#9bb2c1;--navy:#061422;--panel:#0c2133;--line:#1c4054;--cyan:#3de8da;--violet:#8277ff;--gold:#ffd166;--danger:#ff7180}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#174b63,transparent 30%),radial-gradient(circle at 88% 84%,#292268,transparent 33%),var(--navy);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.app{width:min(1120px,100%);margin:auto;padding:26px 18px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--cyan);border-radius:15px;background:#0b3140;color:var(--cyan);font-size:25px;box-shadow:0 0 25px #3de8da33}.eyebrow{margin:0;color:var(--cyan);font-size:.73rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.5rem,4vw,2.15rem);letter-spacing:-.05em}.progress{text-align:right}.progress strong{display:block;font-size:1.35rem}.progress span{font-size:.8rem;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:18px}.game-card,.sidebar,.modal-card{background:linear-gradient(145deg,#0d2739,#071a29);border:1px solid var(--line);box-shadow:0 20px 55px #0005}.game-card{position:relative;padding:12px;border-radius:22px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:7/9;border-radius:13px;background:#091f31;touch-action:none}.sidebar{border-radius:22px;padding:20px}.stat{padding:12px 0;border-bottom:1px solid var(--line)}.stat label{display:block;color:var(--muted);font-size:.73rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.stat strong{font-size:1.7rem}.legend{margin:21px 0;color:var(--muted);font-size:.87rem}.legend b{color:var(--ink)}.key{display:inline-grid;min-width:25px;place-items:center;padding:2px 5px;margin:2px;border:1px solid #416276;border-radius:5px;color:var(--ink);font-size:.72rem}button{border:0;border-radius:11px;font:inherit;font-weight:800;cursor:pointer}.restart{width:100%;padding:11px;background:var(--cyan);color:#06202a}.overlay{position:absolute;inset:12px;z-index:2;display:grid;place-items:center;padding:14px;background:#05111cdd;backdrop-filter:blur(7px);border-radius:13px}.overlay[hidden]{display:none}.modal-card{width:min(100%,620px);border-radius:19px;padding:25px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#164553;color:var(--cyan);font-size:.72rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}h2{margin:13px 0 9px;font-size:clamp(1.25rem,3vw,1.7rem);line-height:1.24}.modal-card p{color:var(--muted)}.answers{display:grid;gap:10px;margin-top:19px}.answer{padding:13px 14px;text-align:left;color:var(--ink;background:#102f43;border:1px solid #28566b}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:var(--cyan);background:#164055}.answer:disabled{cursor:default}.answer.correct{color:#042124;background:var(--cyan);border-color:var(--cyan)}.answer.wrong{background:#51242d;border-color:var(--danger)}.feedback{min-height:24px;margin:14px 0 0!important;font-weight:750}.good{color:var(--cyan)!important}.bad{color:#ffadb5!important}.continue{margin-top:15px;padding:10px 17px;color:#181400;background:var(--gold)}.final-score{margin:7px 0!important;color:var(--cyan)!important;font-size:2.7rem;font-weight:900}.final-status{font-size:1.14rem;font-weight:800}.controls{display:none}@media(max-width:720px){.app{padding:15px 11px}header{align-items:flex-start}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:12px}.stat{padding:5px;border:0;border-right:1px solid var(--line)}.stat strong{font-size:1.25rem}.legend,.restart{grid-column:1/-1}.legend{margin:8px 0}.controls{display:flex;position:absolute;z-index:1;bottom:22px;inset-inline:25px;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:57px;height:44px;background:#102f43dd;border:1px solid #3e6a7d;color:var(--ink);font-size:1.4rem}.modal-card{padding:19px}.overlay{padding:8px}}
  </style>
</head>
<body>
  <main class="app"><header><div class="brand"><div class="logo">⌁</div><div><p class="eyebrow">Cyber Academy · Évaluation gamifiée</p><h1>Cyber Jump</h1></div></div><div class="progress"><strong id="questionProgress">0 / 10</strong><span>défis complétés</span></div></header>
  <section class="layout"><div class="game-card"><canvas id="game" width="700" height="900" aria-label="Jeu de plateforme Cyber Jump"></canvas><div class="controls"><button data-move="left" aria-label="Aller à gauche">←</button><button data-move="right" aria-label="Aller à droite">→</button></div><div class="overlay" id="overlay"><div class="modal-card" id="modal"></div></div></div>
  <aside class="sidebar"><div class="stat"><label>Altitude</label><strong id="altitude">0 m</strong></div><div class="stat"><label>Bonnes réponses</label><strong id="score">0</strong></div><div class="stat"><label>Bonus actif</label><strong id="bonus">—</strong></div><p class="legend"><b>Atterrissez sur les plateformes.</b><br>Utilisez <span class="key">←</span><span class="key">→</span> ou <span class="key">Q</span><span class="key">D</span>. Les bonus <b>↑</b> propulsent plus haut, les <b>2×</b> offrent un double saut.</p><button class="restart" id="restart">Nouvelle partie</button></aside></section></main>
  <script>
  const bank = [
    ['IAM','Quel est le principe du moindre privilège ?','Donner tous les droits pour éviter les blocages.','Donner des droits selon le poste, sans les revoir.','N’accorder seulement les accès nécessaires, pour la durée nécessaire.'],['IAM','Quel facteur MFA résiste le mieux au phishing ?','Un mot de passe très long.','Un code reçu par SMS.','Une clé FIDO2 liée au site d’origine.'],['IAM','Pourquoi désactiver vite un compte sortant ?','Pour libérer la boîte mail.','Pour arrêter les newsletters.','Pour retirer sans délai un accès devenu injustifié.'],['IAM','À quoi sert un gestionnaire de mots de passe ?','À publier les secrets de l’équipe.','À mémoriser un mot de passe simple.','À générer et stocker des mots de passe uniques et robustes.'],['IAM','Quel risque pose un compte partagé ?','Il rend toujours le travail plus rapide.','Il est acceptable pour une petite équipe.','Il empêche d’attribuer précisément les actions à une personne.'],['IAM','Quelle pratique protège un compte administrateur ?','L’utiliser pour lire ses e-mails.','Le partager pendant les astreintes.','Utiliser un compte séparé, MFA et limité à l’administration.'],['IAM','Que signifie SSO ?','Une sauvegarde automatique des sessions.','Une connexion identique sur chaque appareil.','Une authentification centralisée pour plusieurs applications.'],['IAM','Que vérifie une revue d’accès ?','La couleur du portail de connexion.','La liste des comptes sans la modifier.','Que chaque droit reste justifié par son responsable.'],['IAM','Quel est l’objectif du PAM ?','Rendre tous les comptes administrateurs.','Conserver les mots de passe en clair.','Contrôler, tracer et limiter les accès privilégiés.'],['IAM','Pourquoi utiliser des comptes nominatifs ?','Pour éviter tout audit.','Pour partager plus facilement les identifiants.','Pour assurer la traçabilité et la responsabilité des actions.'],['IAM','Quelle règle pour un secret d’API ?','Le mettre dans le dépôt Git.','Le chiffrer dans un commentaire.','Le stocker dans un coffre de secrets et le faire tourner.'],['IAM','À quoi sert le provisioning ?','À créer des comptes sans règles.','À garder les droits après une mobilité.','À attribuer et retirer les accès selon le cycle de vie.'],['IAM','Quel accès doit être préféré ?','Un accès permanent très large.','Un accès large revu chaque année.','Un accès juste-à-temps, limité et journalisé.'],['IAM','Pourquoi révoquer les sessions après un changement de rôle ?','Pour changer le fond d’écran.','Pour éviter seulement les notifications.','Pour empêcher la poursuite de sessions associées à des droits retirés.'],
    ['GRC','Quel est le but d’une analyse de risques ?','Éliminer tous les risques à tout prix.','Les classer seulement par couleur.','Identifier, évaluer et traiter les risques par priorité.'],['GRC','Qu’est-ce qu’une mesure de sécurité ?','Dire que les pirates sont dangereux.','Noter un risque dans un tableur.','Mettre en place un contrôle, comme la MFA ou le chiffrement.'],['GRC','Que signifie accepter un risque ?','L’oublier volontairement.','Le transférer sans trace.','Le conserver en connaissance de cause après validation.'],['GRC','À quoi sert une politique de sécurité ?','À remplacer les outils techniques.','À écrire des règles sans les communiquer.','À fixer les règles, responsabilités et attentes de sécurité.'],['GRC','Quelle est une preuve d’audit fiable ?','Une promesse orale.','Une capture sans contexte.','Un journal ou rapport daté démontrant un contrôle.'],['GRC','Pourquoi tenir un registre des risques ?','Pour multiplier les réunions.','Pour suivre seulement les incidents.','Pour suivre propriétaires, traitements, échéances et niveaux de risque.'],['GRC','Qu’est-ce que la conformité ?','Copier un concurrent.','Passer un audit sans changer.','Respecter les exigences légales, contractuelles ou internes applicables.'],['GRC','Qui porte un risque métier ?','Uniquement l’équipe sécurité.','La personne qui remplit le tableur.','Un propriétaire de risque responsable de sa décision.'],['GRC','Quel traitement réduit la probabilité d’un risque ?','Ne rien documenter.','Changer son nom dans le registre.','Mettre en œuvre un contrôle préventif adapté.'],['GRC','Pourquoi définir un appétit au risque ?','Pour garantir zéro risque.','Pour éviter toute décision.','Pour cadrer le niveau de risque acceptable par l’organisation.'],['GRC','Quel est le rôle d’un contrôle compensatoire ?','Annuler les politiques.','Reporter un risque sans action.','Réduire le risque lorsqu’un contrôle principal manque.'],['GRC','Que documente une exception sécurité ?','Une règle supprimée en secret.','Une préférence personnelle.','Le risque, la justification, l’approbation et une échéance.'],
    ['SOC','Quel signal doit déclencher une investigation SOC ?','Un écran éteint.','Une alerte isolée sans contexte.','Une activité anormale corrélée à des indicateurs de compromission.'],['SOC','Quel est le rôle d’un SIEM ?','Bloquer physiquement les intrus.','Conserver seulement les e-mails.','Centraliser et corréler les journaux pour détecter des événements suspects.'],['SOC','Quelle est la première étape de réponse à incident ?','Communiquer publiquement immédiatement.','Redémarrer tous les serveurs.','Qualifier l’alerte pour confirmer l’incident et son périmètre.'],['SOC','Pourquoi conserver des journaux horodatés ?','Pour remplir le disque.','Pour compliquer les recherches.','Pour reconstituer les événements lors d’une investigation.'],['SOC','Qu’est-ce que le confinement (containment) ?','Documenter après la clôture.','Attendre que l’attaquant parte.','Limiter la propagation et l’impact de l’incident.'],['SOC','Une alerte EDR signale un binaire inconnu : que faire ?','Le déclarer sûr.','Le supprimer sans collecte.','Analyser l’hôte, le contexte et les indicateurs avant décision.'],['SOC','Quel indicateur mesure la rapidité de détection ?','La couleur du tableau de bord.','Le nombre de postes.','Le délai moyen de détection, ou MTTD.'],['SOC','Pourquoi créer des playbooks SOC ?','Pour empêcher les analystes de réfléchir.','Pour rendre chaque réponse différente.','Pour guider une réponse cohérente, rapide et traçable.'],['SOC','Qu’est-ce qu’un faux positif ?','Une attaque confirmée.','Une alerte ignorée sans analyse.','Une alerte qui semble malveillante mais ne l’est pas.'],['SOC','Pourquoi enrichir une alerte avec du renseignement ?','Pour la rendre plus longue.','Pour remplacer toute analyse humaine.','Pour mieux évaluer les indicateurs, la menace et la priorité.'],['SOC','Quel artefact aide à investiguer un phishing ?','La couleur du logo.','Le prénom du destinataire seulement.','Les en-têtes, URL, pièces jointes et journaux de messagerie.'],['SOC','Après l’éradication, que faut-il vérifier ?','Que le ticket est court.','Que la machine a redémarré.','Que le service est restauré et qu’aucune persistance ne reste.'],
    ['Sécurité de l’IA','Quel risque est lié à l’injection de prompt ?','Une batterie faible.','Une faute de frappe.','Des instructions malveillantes qui détournent le modèle.'],['Sécurité de l’IA','Comment protéger les données envoyées à un modèle ?','Envoyer toutes les données secrètes.','Retirer seulement le nom du fichier.','Minimiser, classifier et anonymiser les données nécessaires.'],['Sécurité de l’IA','Qu’est-ce qu’une hallucination IA ?','Un modèle qui s’éteint.','Une réponse créative non vérifiée.','Une information plausible mais fausse présentée comme vraie.'],['Sécurité de l’IA','Quelle mesure réduit les actions dangereuses d’un agent ?','Lui donner l’accès administrateur permanent.','Lui demander simplement d’être prudent.','Limiter ses permissions, valider les actions sensibles et journaliser.'],['Sécurité de l’IA','Pourquoi évaluer un modèle avant déploiement ?','Pour choisir la plus belle interface.','Pour vérifier seulement sa vitesse.','Pour tester performances, biais, sécurité et comportements indésirables.'],['Sécurité de l’IA','Que faire d’une réponse IA pour une décision sensible ?','L’appliquer automatiquement.','La relire si elle paraît étrange.','La faire vérifier par un humain compétent et des sources fiables.'],['Sécurité de l’IA','Quel risque présente un jeu de données empoisonné ?','Le modèle devient plus rapide.','Les données sont plus nombreuses.','Des données malveillantes influencent les sorties du modèle.'],['Sécurité de l’IA','Pourquoi isoler les outils appelés par un agent ?','Pour les rendre invisibles.','Pour éviter tout journal.','Pour limiter les effets d’une commande compromise ou erronée.'],['Sécurité de l’IA','Quel contrôle protège une base RAG ?','Y importer toutes les données.','Faire confiance au titre des documents.','Contrôler les sources, droits d’accès et contenus ingérés.'],['Sécurité de l’IA','Quel est le principe de l’alignement des sorties ?','Forcer le modèle à répondre toujours.','Lui donner des privilèges élevés.','Définir des garde-fous pour respecter l’usage et les politiques.'],['Sécurité de l’IA','Pourquoi journaliser les usages d’IA ?','Pour entraîner automatiquement le modèle.','Pour stocker des secrets en clair.','Pour auditer les interactions, incidents et actions réalisées.'],['Sécurité de l’IA','Que limite le filtrage d’entrées ?','La vitesse du réseau.','La taille de l’écran.','Les prompts malveillants, données interdites et abus prévisibles.']
  ];
  const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
  let chosen,answered,score,altitude,player,platforms,bonuses,keys,running,last,raf,worldY,doubleJump,boost;
  const shuffle=a=>[...a].sort(()=>Math.random()-.5), rand=(a,b)=>a+Math.random()*(b-a);
  function pickQuestions(){const domains=['IAM','GRC','SOC','Sécurité de l’IA'], guaranteed=domains.flatMap(d=>shuffle(bank.filter(q=>q[0]===d)).slice(0,2));return shuffle([...guaranteed,...shuffle(bank.filter(q=>!guaranteed.includes(q))).slice(0,2)])}
  function setup(){chosen=pickQuestions();answered=score=altitude=worldY=0;keys={left:false,right:false};player={x:330,y:700,vx:0,vy:-13,w:36,h:42,jumps:0};platforms=[{x:245,y:790,w:210},{x:70,y:675,w:130},{x:400,y:550,w:145},{x:180,y:430,w:125},{x:440,y:315,w:120},{x:120,y:195,w:150},{x:370,y:75,w:145}];bonuses=[{x:118,y:642,type:'boost'},{x:470,y:282,type:'double'}];doubleJump=0;boost=0;running=false;cancelAnimationFrame(raf);stats();draw();startModal()}
  function stats(){$('questionProgress').textContent=`${answered} / 10`;$('score').textContent=score;$('altitude').textContent=`${Math.floor(altitude)} m`;$('bonus').textContent=boost>0?'Saut turbo':doubleJump>0?'Double saut':'—'}
  function show(html){$('modal').innerHTML=html;$('overlay').hidden=false} function hide(){$('overlay').hidden=true}
  function startModal(){show(`<span class="tag">Prêt à grimper</span><h2>10 chutes, 10 défis cyber</h2><p>Rebondissez de plateforme en plateforme. À chaque chute, le jeu se met en pause : répondez au défi pour reprendre votre ascension. Attrapez les bonus de saut !</p><button class="continue" id="start">Démarrer</button>`);$('start').onclick=()=>{hide();running=true;last=performance.now();raf=requestAnimationFrame(loop)}}
  function loop(t){if(!running)return;const dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
  function update(dt){const p=player;p.vx+=(keys.left?-1:keys.right?1:0)*.7*dt;p.vx*=Math.pow(.83,dt);p.x+=p.vx*dt;p.x=Math.max(0,Math.min(700-p.w,p.x));p.vy+=.48*dt;p.y+=p.vy*dt;if(p.vy>0){for(const pl of platforms){if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>=pl.y&&p.y+p.h-p.vy*dt<pl.y){p.y=pl.y-p.h;p.vy=-(boost?18:13);boost=Math.max(0,boost-1);p.jumps=0}}}for(let i=bonuses.length-1;i>=0;i--){let b=bonuses[i];if(Math.abs(p.x+p.w/2-b.x)<30&&Math.abs(p.y+p.h/2-b.y)<34){if(b.type==='boost')boost=3;else doubleJump=2;bonuses.splice(i,1);stats()}}if(p.y<300){const d=300-p.y;p.y=300;platforms.forEach(x=>x.y+=d);bonuses.forEach(x=>x.y+=d);worldY+=d;altitude=Math.max(altitude,worldY/3);while(platforms.filter(x=>x.y<900).length<7){const top=Math.min(...platforms.map(x=>x.y));platforms.push({x:rand(35,530),y:top-rand(105,145),w:rand(105,165)});if(Math.random()<.3)bonuses.push({x:rand(65,630),y:top-rand(30,95),type:Math.random()<.5?'boost':'double'})}platforms=platforms.filter(x=>x.y<970);bonuses=bonuses.filter(x=>x.y<970);stats()}if(p.y>930)fall()}
  function fall(){running=false;cancelAnimationFrame(raf);if(answered>=10)return finish();answered++;stats();question(chosen[answered-1])}
  function question(q){const answers=shuffle(q.slice(2));show(`<span class="tag">${q[0]} · Défi ${answered}/10</span><h2>${q[1]}</h2><div class="answers">${answers.map((a,i)=>`<button class="answer" data-a="${encodeURIComponent(a)}"><b>${'ABC'[i]}.</b> ${a}</button>`).join('')}</div><p class="feedback" id="feedback"></p><button class="continue" id="next" hidden>Reprendre le saut</button>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.a),q))}
  function answer(a,q){const ok=a===q[4];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;const v=decodeURIComponent(b.dataset.a);if(v===q[4])b.classList.add('correct');else if(v===a)b.classList.add('wrong')});if(ok)score++;stats();const f=$('feedback');f.textContent=ok?'✓ Réponse juste : votre prochaine ascension vous attend !':'À retenir : '+q[4];f.className='feedback '+(ok?'good':'bad');$('next').hidden=false;$('next').onclick=()=>{hide();if(answered===10)finish();else resetJump()}}
  function resetJump(){player={x:330,y:700,vx:0,vy:-13,w:36,h:42,jumps:0};platforms=[{x:245,y:790,w:210},{x:70,y:675,w:130},{x:400,y:550,w:145},{x:180,y:430,w:125},{x:440,y:315,w:120},{x:120,y:195,w:150},{x:370,y:75,w:145}];bonuses=[{x:118,y:642,type:'boost'},{x:470,y:282,type:'double'}];boost=doubleJump=0;running=true;last=performance.now();raf=requestAnimationFrame(loop)}
  function finish(){running=false;cancelAnimationFrame(raf);const pass=score>8;show(`<span class="tag">Parcours terminé</span><h2>${pass?'Compétences validées':'Parcours à consolider'}</h2><p class="final-score">${score} / 10</p><p class="final-status">${pass?'Excellent : vous maîtrisez les fondamentaux de la cybersécurité.':'Il faut plus de 8 bonnes réponses pour valider les compétences. Réessayez pour progresser !'}</p><button class="continue" id="again">Rejouer</button>`);$('again').onclick=setup}
  function draw(){ctx.clearRect(0,0,700,900);const g=ctx.createLinearGradient(0,0,0,900);g.addColorStop(0,'#123851');g.addColorStop(1,'#071724');ctx.fillStyle=g;ctx.fillRect(0,0,700,900);ctx.fillStyle='#ffffff0a';for(let i=0;i<45;i++){ctx.fillRect((i*97)%700,(i*71+worldY*.15)%900,2,2)}platforms.forEach(p=>{ctx.fillStyle='#1d6571';ctx.fillRect(p.x,p.y,p.w,15);ctx.fillStyle='#43e6d8';ctx.fillRect(p.x,p.y,p.w,4);ctx.fillStyle='#0a2a38';ctx.fillRect(p.x+9,p.y+15,8,8);ctx.fillRect(p.x+p.w-17,p.y+15,8,8)});bonuses.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,20,0,7);ctx.fillStyle=b.type==='boost'?'#ffd166':'#8277ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#082033';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(b.type==='boost'?'↑':'2×',b.x,b.y+6)});const p=player;ctx.fillStyle='#a7fff6';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#183c54';ctx.fillRect(p.x+7,p.y+10,7,7);ctx.fillRect(p.x+23,p.y+10,7,7);ctx.fillStyle='#3de8da';ctx.fillRect(p.x+5,p.y+p.h,8,6);ctx.fillRect(p.x+23,p.y+p.h,8,6)}
  function move(e,on){if(e.key==='ArrowLeft'||e.key==='q'||e.key==='Q')keys.left=on;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=on;if(on&&(e.key==='ArrowUp'||e.key===' '||e.key==='z'||e.key==='Z')&&doubleJump>0&&player.vy>0){player.vy=-12;doubleJump--;stats()}if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault()}document.addEventListener('keydown',e=>move(e,true));document.addEventListener('keyup',e=>move(e,false));document.querySelectorAll('[data-move]').forEach(b=>{const side=b.dataset.move;b.onpointerdown=()=>keys[side]=true;b.onpointerup=b.onpointerleave=()=>keys[side]=false});$('restart').onclick=setup;setup();
  </script>
</body>
</html>
