<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Snake — Cyber Academy</title>
  <style>
    :root { --bg:#07121f; --panel:#0d2030; --line:#1a3b50; --ink:#e8f5fb; --muted:#91a9b8; --cyan:#3ce5d8; --blue:#55a7ff; --red:#ff6d76; --yellow:#ffd363; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 15%, #123a4c 0, transparent 30%), radial-gradient(circle at 85% 80%, #172c65 0, transparent 32%), var(--bg); color:var(--ink); font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { width:min(100%, 1080px); padding:28px 20px; } header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:22px; } .brand { display:flex; gap:13px; align-items:center; } .mark { width:46px; height:46px; border:1px solid var(--cyan); border-radius:14px; display:grid; place-items:center; background:#0b2b38; color:var(--cyan); font-size:24px; box-shadow:0 0 25px #3ce5d833; } h1 { margin:0; font-size:clamp(1.4rem, 4vw, 2rem); letter-spacing:-.04em; } .eyebrow { margin:0 0 2px; color:var(--cyan); font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.14em; } .progress { min-width:158px; text-align:right; } .progress strong { display:block; font-size:1.25rem; } .progress span { color:var(--muted); font-size:.8rem; }
    .game-layout { display:grid; grid-template-columns:minmax(0, 1fr) 235px; gap:18px; } .board-wrap, .side, .modal-card { background:linear-gradient(145deg, #0e2535, #091a28); border:1px solid var(--line); box-shadow:0 18px 50px #0004; } .board-wrap { padding:12px; border-radius:20px; position:relative; } canvas { display:block; width:100%; aspect-ratio:1; background:#071823; border-radius:12px; image-rendering:pixelated; } .side { border-radius:20px; padding:22px; } .stat { padding:13px 0; border-bottom:1px solid var(--line); } .stat:last-of-type { border:0; } .stat label { display:block; color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; } .stat strong { font-size:1.6rem; } .legend { margin-top:22px; color:var(--muted); font-size:.85rem; } .legend b { color:var(--ink); } .key { display:inline-grid; place-items:center; min-width:25px; padding:2px 5px; border:1px solid #3e5c70; border-radius:5px; color:var(--ink); font-size:.72rem; margin:2px; } button { border:0; border-radius:10px; font:inherit; font-weight:750; cursor:pointer; } #restart { margin-top:20px; width:100%; padding:11px; color:#08212d; background:var(--cyan); } #restart:hover { filter:brightness(1.08); }
    .overlay { position:absolute; inset:12px; display:flex; align-items:center; justify-content:center; padding:16px; border-radius:12px; background:#06111ddd; backdrop-filter:blur(6px); } .overlay[hidden] { display:none; } .modal-card { width:min(100%, 600px); border-radius:18px; padding:26px; } .tag { display:inline-block; padding:4px 9px; border-radius:999px; color:var(--cyan); background:#163f48; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.09em; } h2 { margin:13px 0 10px; font-size:clamp(1.25rem, 3vw, 1.65rem); line-height:1.25; } .modal-card p { color:var(--muted); } .answers { display:grid; gap:10px; margin-top:20px; } .answer { text-align:left; padding:13px 15px; color:var(--ink); background:#102b3c; border:1px solid #285066; transition:.15s; } .answer:hover:not(:disabled) { transform:translateY(-1px); border-color:var(--cyan); background:#15394c; } .answer:disabled { cursor:default; } .answer.correct { color:#04191a; background:var(--cyan); border-color:var(--cyan); } .answer.wrong { background:#4a2029; border-color:var(--red); } .feedback { min-height:25px; margin:15px 0 0!important; font-weight:700; } .feedback.good { color:var(--cyan); } .feedback.bad { color:#ff9da3; } .continue { margin-top:15px; padding:10px 17px; color:#071823; background:var(--yellow); } .final-score { color:var(--cyan)!important; font-size:2.6rem; font-weight:850; margin:8px 0!important; } .final-status { color:var(--ink)!important; font-size:1.2rem; font-weight:800; }
    @media (max-width:700px) { .app { padding:16px 12px; } header { margin-bottom:15px; } .game-layout { grid-template-columns:1fr; } .side { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:12px; } .stat { padding:4px 8px; border-bottom:0; border-right:1px solid var(--line); } .stat:last-of-type { border:0; } .stat strong { font-size:1.25rem; } .legend, #restart { grid-column:1/-1; margin-top:5px; } .overlay { inset:12px; padding:8px; } .modal-card { padding:20px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="mark">⌬</div><div><p class="eyebrow">Cyber Academy · Évaluation</p><h1>Cyber Snake</h1></div></div><div class="progress"><strong id="questionProgress">0 / 10</strong><span>questions relevées</span></div></header>
    <section class="game-layout"><div class="board-wrap"><canvas id="board" width="600" height="600" aria-label="Plateau de jeu du serpent"></canvas><div class="overlay" id="overlay"><div class="modal-card" id="modal"></div></div></div>
      <aside class="side"><div class="stat"><label>Briques mangées</label><strong id="bricks">0</strong></div><div class="stat"><label>Bonnes réponses</label><strong id="score">0</strong></div><div class="stat"><label>Domaine</label><strong id="domain">—</strong></div><div class="legend"><b>Déplacez le serpent</b><br><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> ou ZQSD<br><br>Mangez une brique, répondez, puis poursuivez votre parcours.</div><button id="restart">Nouvelle partie</button></aside>
    </section>
  </main>
  <script>
    const questions = [
      ['IAM','Quel est le principe du moindre privilège ?', 'Donner tous les droits pour éviter les blocages.', 'Donner des droits selon le poste, sans les revoir.', 'N’accorder que les accès nécessaires, pour la durée nécessaire.'],
      ['IAM','Quel facteur rend la MFA plus résistante au phishing ?', 'Un mot de passe de plus de 40 caractères.', 'Un code SMS envoyé au téléphone.', 'Une clé de sécurité FIDO2 liée au site d’origine.'],
      ['IAM','Pourquoi supprimer rapidement le compte d’un collaborateur sortant ?', 'Pour libérer de la place dans la messagerie.', 'Pour éviter qu’il reçoive encore les newsletters.', 'Pour retirer sans délai un accès qui n’est plus justifié.'],
      ['IAM','À quoi sert un gestionnaire de mots de passe ?', 'À publier les mots de passe de l’équipe.', 'À mémoriser un unique mot de passe simple.', 'À créer et stocker des mots de passe uniques et robustes.'],
      ['IAM','Qu’est-ce qu’une revue périodique des accès ?', 'Un contrôle visuel du logo de connexion.', 'Une liste envoyée une fois sans action attendue.', 'Une validation des droits par leurs responsables, avec retrait des accès inutiles.'],
      ['IAM','Quel risque pose un compte partagé ?', 'Il est toujours plus rapide à utiliser.', 'Il peut être pratique pour une petite équipe.', 'Il empêche d’attribuer précisément les actions à une personne.'],
      ['IAM','Quelle pratique est la plus sûre pour un compte administrateur ?', 'L’utiliser pour lire ses e-mails.', 'Le partager lors des astreintes.', 'Utiliser un compte séparé, protégé par MFA, seulement pour l’administration.'],
      ['IAM','Que signifie SSO ?', 'Une sauvegarde automatique des sessions.', 'Une connexion identique sur chaque appareil.', 'Une authentification centralisée donnant accès à plusieurs applications.'],
      ['GRC','Quel est le but premier d’une analyse de risques ?', 'Éliminer tous les risques à tout prix.', 'Classer les risques par couleur seulement.', 'Identifier, évaluer et traiter les risques de façon priorisée.'],
      ['GRC','Quel exemple décrit une mesure de sécurité ?', 'Dire que les pirates sont dangereux.', 'Noter un risque dans un tableur.', 'Mettre en place un contrôle, comme le chiffrement ou la MFA.'],
      ['GRC','Que signifie accepter un risque ?', 'Oublier le risque volontairement.', 'Le transférer sans le documenter.', 'Le conserver en connaissance de cause après validation appropriée.'],
      ['GRC','À quoi sert une politique de sécurité ?', 'À remplacer tous les outils techniques.', 'À écrire des règles sans les communiquer.', 'À fixer les règles, responsabilités et attentes de sécurité.'],
      ['GRC','Quel est un exemple de preuve d’audit ?', 'Une promesse orale non datée.', 'Une capture d’écran sans contexte.', 'Un journal, un rapport ou une validation datée démontrant un contrôle.'],
      ['GRC','Pourquoi tenir un registre des risques ?', 'Pour augmenter le nombre de réunions.', 'Pour ne suivre que les risques déjà réalisés.', 'Pour suivre propriétaires, traitements, échéances et niveau de risque.'],
      ['GRC','Qu’est-ce que la conformité ?', 'Copier toutes les pratiques d’un concurrent.', 'Passer un audit sans changer les pratiques.', 'Respecter des exigences applicables, légales, contractuelles ou internes.'],
      ['SOC','Quel signal doit déclencher une investigation SOC ?', 'Un écran d’ordinateur éteint.', 'Une alerte isolée sans contexte.', 'Une activité anormale corrélée à des indicateurs de compromission.'],
      ['SOC','Quel est le rôle d’un SIEM ?', 'Bloquer physiquement les intrus.', 'Conserver seulement les e-mails.', 'Centraliser et corréler les journaux pour détecter des événements suspects.'],
      ['SOC','Quelle est la première étape d’une réponse à incident ?', 'Communiquer publiquement avant toute vérification.', 'Redémarrer tous les serveurs.', 'Qualifier et analyser l’alerte pour confirmer l’incident et son périmètre.'],
      ['SOC','Pourquoi conserver des journaux horodatés ?', 'Pour remplir l’espace disque.', 'Pour rendre les recherches plus longues.', 'Pour reconstituer les événements et soutenir l’investigation.'],
      ['SOC','Qu’est-ce que le "containment" ?', 'Documenter l’incident une fois clos.', 'Attendre que l’attaquant s’arrête.', 'Limiter la propagation et l’impact de l’incident.'],
      ['SOC','Une alerte EDR indique un binaire inconnu : que faire ?', 'Le déclarer immédiatement sûr.', 'Le supprimer sans collecter d’information.', 'Analyser le contexte, l’hôte et les indicateurs avant de décider.'],
      ['SOC','Quel indicateur est utile pour mesurer la détection ?', 'La couleur du tableau de bord.', 'Le nombre total de postes.', 'Le délai moyen entre l’événement et sa détection (MTTD).'],
      ['SOC','Pourquoi créer des playbooks SOC ?', 'Pour empêcher les analystes de réfléchir.', 'Pour rendre chaque réponse complètement différente.', 'Pour guider une réponse cohérente, rapide et traçable aux scénarios récurrents.'],
      ['Sécurité de l’IA','Quel risque est lié à l’injection de prompt ?', 'Une batterie qui se décharge vite.', 'Une faute de frappe dans une question.', 'Des instructions malveillantes qui tentent de détourner le comportement du modèle.'],
      ['Sécurité de l’IA','Comment protéger les données envoyées à un modèle ?', 'Envoyer toutes les données, même secrètes.', 'Retirer seulement le nom du fichier.', 'Minimiser, classifier et anonymiser les données selon le besoin.'],
      ['Sécurité de l’IA','Qu’est-ce qu’une hallucination d’IA ?', 'Un modèle qui s’éteint sans raison.', 'Une réponse très créative mais non vérifiée.', 'Une information plausible mais fausse, présentée comme vraie.'],
      ['Sécurité de l’IA','Quelle mesure réduit le risque d’actions dangereuses par un agent IA ?', 'Lui donner un accès administrateur permanent.', 'Lui demander d’être prudent dans le prompt.', 'Limiter ses permissions, valider les actions sensibles et journaliser.'],
      ['Sécurité de l’IA','Pourquoi évaluer un modèle avant son déploiement ?', 'Pour choisir l’interface la plus colorée.', 'Pour vérifier uniquement sa vitesse.', 'Pour tester ses performances, biais, sécurité et comportements indésirables.'],
      ['Sécurité de l’IA','Que faut-il faire d’une réponse IA utilisée dans une décision sensible ?', 'L’appliquer automatiquement.', 'La relire seulement si elle paraît étrange.', 'La faire vérifier par un humain compétent avec des sources fiables.'],
      ['Sécurité de l’IA','Quel est le risque d’un jeu de données d’entraînement empoisonné ?', 'Le modèle devient toujours plus rapide.', 'Les données sont simplement plus nombreuses.', 'Des données malveillantes influencent les comportements ou sorties du modèle.']
    ];
    const canvas = document.getElementById('board'), ctx = canvas.getContext('2d'), size = 20, cells = 30;
    const el = id => document.getElementById(id); let snake, direction, nextDirection, food, selected, answered, score, eaten, timer, running, gameOver;
    const shuffle = a => [...a].sort(() => Math.random() - .5);
    function setup() { selected = shuffle(questions).slice(0, 10); snake = [{x:15,y:16},{x:14,y:16},{x:13,y:16}]; direction = nextDirection = {x:1,y:0}; food = placeFood(); answered = score = eaten = 0; running = false; gameOver = false; clearInterval(timer); updateStats(); draw(); showStart(); }
    function placeFood() { let p; do p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}; while(snake.some(s=>s.x===p.x&&s.y===p.y)); return p; }
    function updateStats() { el('bricks').textContent=eaten; el('score').textContent=score; el('questionProgress').textContent=`${answered} / 10`; el('domain').textContent=answered ? selected[Math.min(answered,9)][0] : '—'; }
    function draw() { ctx.fillStyle='#071823'; ctx.fillRect(0,0,600,600); ctx.strokeStyle='#123040'; ctx.lineWidth=1; for(let i=0;i<=600;i+=size){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,600);ctx.moveTo(0,i);ctx.lineTo(600,i);ctx.stroke();} ctx.fillStyle='#ffbf4e'; ctx.shadowColor='#ffbd45';ctx.shadowBlur=16;ctx.fillRect(food.x*size+3,food.y*size+3,size-6,size-6);ctx.shadowBlur=0; snake.forEach((s,i)=>{ctx.fillStyle=i?'#38cbbf':'#a5fff6';ctx.fillRect(s.x*size+2,s.y*size+2,size-4,size-4);}); }
    function tick() { direction=nextDirection; const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y}; if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)){ endGame('Collision détectée'); return; } snake.unshift(head); if(head.x===food.x&&head.y===food.y){ eaten++; answered++; updateStats(); clearInterval(timer); running=false; draw(); showQuestion(selected[answered-1]); } else snake.pop(); draw(); }
    function start() { if(gameOver || answered>=10) return; running=true; timer=setInterval(tick,105); }
    function show(content) { el('modal').innerHTML=content; el('overlay').hidden=false; }
    function showStart() { show(`<span class="tag">Prêt pour l’évaluation</span><h2>10 briques, 10 défis cyber</h2><p>Dirigez le serpent vers les briques. Chaque brique ouvre une question à choix multiples, couvrant l’IAM, la GRC, le SOC et la sécurité de l’IA.</p><button class="continue" id="start">Démarrer la partie</button>`); el('start').onclick=()=>{el('overlay').hidden=true;start()}; }
    function showQuestion(q) { const choices=shuffle([q[2],q[3],q[4]]); show(`<span class="tag">${q[0]} · Question ${answered}/10</span><h2>${q[1]}</h2><div class="answers">${choices.map((c,i)=>`<button class="answer" data-value="${encodeURIComponent(c)}"><b>${'ABC'[i]}.</b> ${c}</button>`).join('')}</div><p class="feedback" id="feedback"></p><button class="continue" id="next" hidden>Continuer</button>`); document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.value),q)); }
    function answer(value,q) { const correct=value===q[4], buttons=document.querySelectorAll('.answer'); buttons.forEach(b=>{b.disabled=true; const v=decodeURIComponent(b.dataset.value); if(v===q[4])b.classList.add('correct'); else if(v===value)b.classList.add('wrong');}); if(correct)score++; el('score').textContent=score; const feedback=el('feedback'); feedback.textContent=correct?'✓ Réponse juste : le serpent peut poursuivre sa mission.':'Réponse à retenir : '+q[4]; feedback.className='feedback '+(correct?'good':'bad'); el('next').hidden=false; el('next').onclick=()=>{el('overlay').hidden=true; if(answered===10) endGame('Parcours terminé'); else { food=placeFood(); draw(); start(); }}; }
    function endGame(reason) { clearInterval(timer); running=false; gameOver=true; const passed=score>8; show(`<span class="tag">${reason}</span><h2>${passed?'Compétences validées':'Parcours à consolider'}</h2><p class="final-score">${score} / 10</p><p class="final-status">${passed?'Excellent : vous maîtrisez les fondamentaux de la cybersécurité.':'Il faut plus de 8 bonnes réponses pour valider les compétences. Réessayez pour progresser !'}</p><button class="continue" id="again">Rejouer</button>`); el('again').onclick=setup; }
    document.addEventListener('keydown',e=>{const map={ArrowUp:[0,-1],z:[0,-1],Z:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],q:[-1,0],Q:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}; const v=map[e.key]; if(!v)return; e.preventDefault(); if(v[0]!==-direction.x||v[1]!==-direction.y) nextDirection={x:v[0],y:v[1]};}); el('restart').onclick=setup; setup();
  </script>
</body>
</html>
